<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 736" width="1008" height="736" role="img" aria-labelledby="title desc">
  <title id="title">Polhem layered architecture</title>
  <desc id="desc">From top to bottom: View, ViewModel, API Layer, Business Object with the FormSchema definition hub, Repository, Polhem.Db and the database. A DataSet, the DTO, is carried between the layers from ViewModel to Repository. Each layer is labelled with the MVVM, N-Tier or Clean Architecture role it plays.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; }
      .name { font: 600 14px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 400 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
      .chip-title { font: 600 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .chip-text { font: 400 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .tag-family { font: 600 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.06em; }
      .tag-role { font: 600 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .chip { fill: #ffffff; stroke: #d0d7de; }
      .link { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 2 3; }
      .arrow { stroke: #6e4fd1; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #6e4fd1; }

      .mvvm .band { fill: #eef4ff; } .mvvm .accent { fill: #3b6fd8; } .mvvm .tag { fill: #eef4ff; stroke: #3b6fd8; } .mvvm .tag-family { fill: #3b6fd8; }
      .ntier .band { fill: #e9f6f2; } .ntier .accent { fill: #13896f; } .ntier .tag { fill: #e9f6f2; stroke: #13896f; } .ntier .tag-family { fill: #13896f; }
      .clean .band { fill: #f3efff; } .clean .accent { fill: #6e4fd1; } .clean .tag { fill: #f3efff; stroke: #6e4fd1; } .clean .tag-family { fill: #6e4fd1; }
      .store .band { fill: #f3f4f6; } .store .accent { fill: #6b7280; }
      .hub { fill: #faf8ff; stroke: #6e4fd1; stroke-dasharray: 5 4; }
      .hub-label { font: 600 10px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.06em; fill: #6e4fd1; }
      .rail-head { fill: #13896f; }
      .cyl { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    </style>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow-head" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="1007" height="735" rx="14"/>

  <!-- DataSet: carried between the layers, not a layer of its own -->
  <g class="ntier">
    <rect class="tag" x="24" y="110" width="40" height="442" rx="9"/>
    <path class="rail-head" d="M44,118 l7,9 h-14 z"/>
    <path class="rail-head" d="M44,544 l7,-9 h-14 z"/>
    <g transform="translate(44,331) rotate(-90)">
      <text class="tag-role" x="0" y="-3" text-anchor="middle">DataSet (DTO) <tspan class="tag-family">· N-TIER: DATA TRANSFER</tspan></text>
      <text class="sub" x="0" y="12" text-anchor="middle">master table + detail tables, carried between the layers</text>
    </g>
  </g>

  <g transform="translate(48,0)">
  <!-- View -->
  <g class="mvvm">
    <rect class="band" x="24" y="24" width="696" height="72" rx="10"/>
    <rect class="accent" x="24" y="24" width="5" height="72" rx="2"/>
    <text class="name" x="44" y="65">View</text>
    <rect class="chip" x="196" y="40" width="190" height="40" rx="7"/>
    <text class="chip-title" x="291" y="57" text-anchor="middle">Avalonia</text>
    <text class="sub" x="291" y="72" text-anchor="middle">desktop · browser · mobile</text>
    <rect class="chip" x="394" y="40" width="180" height="40" rx="7"/>
    <text class="chip-title" x="484" y="57" text-anchor="middle">Blazor</text>
    <text class="sub" x="484" y="72" text-anchor="middle">Server · WebAssembly</text>
    <rect class="chip" x="582" y="40" width="122" height="40" rx="7"/>
    <text class="chip-title" x="643" y="65" text-anchor="middle">Your own host</text>
    <line class="link" x1="720" y1="60" x2="740" y2="60"/>
    <rect class="tag" x="740" y="40" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="56">MVVM</text>
    <text class="tag-role" x="756" y="72">View</text>
  </g>

  <!-- ViewModel -->
  <g class="mvvm">
    <rect class="band" x="24" y="110" width="696" height="56" rx="10"/>
    <rect class="accent" x="24" y="110" width="5" height="56" rx="2"/>
    <text class="name" x="44" y="143">ViewModel</text>
    <rect class="chip" x="196" y="120" width="508" height="36" rx="7"/>
    <text class="chip-text" x="450" y="143" text-anchor="middle">Binding structure derived from FormSchema</text>
    <line class="link" x1="720" y1="138" x2="740" y2="138"/>
    <rect class="tag" x="740" y="118" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="134">MVVM</text>
    <text class="tag-role" x="756" y="150">ViewModel</text>
  </g>

  <!-- API Layer -->
  <g class="ntier">
    <rect class="band" x="24" y="180" width="696" height="56" rx="10"/>
    <rect class="accent" x="24" y="180" width="5" height="56" rx="2"/>
    <text class="name" x="44" y="213">API Layer</text>
    <rect class="chip" x="196" y="190" width="508" height="36" rx="7"/>
    <text class="chip-text" x="450" y="213" text-anchor="middle">Polhem.JsonRpc · JSON-RPC 2.0</text>
    <line class="link" x1="720" y1="208" x2="740" y2="208"/>
    <rect class="tag" x="740" y="188" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="204">N-TIER</text>
    <text class="tag-role" x="756" y="220">Presentation</text>
  </g>

  <!-- Business Object with the definition hub -->
  <g class="clean">
    <rect class="band" x="24" y="250" width="696" height="216" rx="10"/>
    <rect class="accent" x="24" y="250" width="5" height="216" rx="2"/>
    <text class="name" x="44" y="283">Business Object</text>
    <text class="sub" x="44" y="299">(BO)</text>

    <rect class="chip" x="196" y="266" width="212" height="40" rx="7"/>
    <text class="chip-title" x="302" y="283" text-anchor="middle">CRUD methods</text>
    <text class="sub" x="302" y="298" text-anchor="middle">FormSchema validation + Repository</text>
    <rect class="chip" x="416" y="266" width="140" height="40" rx="7"/>
    <text class="chip-title" x="486" y="283" text-anchor="middle">Report methods</text>
    <text class="sub" x="486" y="298" text-anchor="middle">AnyCode Repository</text>
    <rect class="chip" x="564" y="266" width="140" height="40" rx="7"/>
    <text class="chip-title" x="634" y="283" text-anchor="middle">Batch methods</text>
    <text class="sub" x="634" y="298" text-anchor="middle">AnyCode Repository</text>

    <rect class="hub" x="196" y="318" width="508" height="134" rx="9"/>
    <text class="hub-label" x="210" y="336">DEFINITION HUB</text>
    <rect class="chip" x="290" y="344" width="320" height="40" rx="7"/>
    <text class="chip-title" x="450" y="361" text-anchor="middle">FormSchema</text>
    <text class="sub" x="450" y="376" text-anchor="middle">field behavior · form relations · validation rules</text>
    <path class="arrow" d="M400,384 L400,394 L330,394 L330,402" marker-end="url(#head)"/>
    <path class="arrow" d="M500,384 L500,394 L570,394 L570,402" marker-end="url(#head)"/>
    <rect class="chip" x="250" y="404" width="160" height="36" rx="7"/>
    <text class="chip-text" x="330" y="427" text-anchor="middle"><tspan class="chip-title">FormLayout</tspan> · UI layout</text>
    <rect class="chip" x="490" y="404" width="160" height="36" rx="7"/>
    <text class="chip-text" x="570" y="427" text-anchor="middle"><tspan class="chip-title">TableSchema</tspan> · tables</text>

    <line class="link" x1="720" y1="286" x2="740" y2="286"/>
    <rect class="tag" x="740" y="266" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="282">CLEAN ARCHITECTURE</text>
    <text class="tag-role" x="756" y="298">Use Case</text>
    <line class="link" x1="720" y1="385" x2="740" y2="385"/>
    <rect class="tag" x="740" y="365" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="381">CLEAN ARCHITECTURE</text>
    <text class="tag-role" x="756" y="397">Domain Core</text>
  </g>

    <g transform="translate(0,-70)">
  <!-- Repository -->
  <g class="clean">
    <rect class="band" x="24" y="550" width="696" height="72" rx="10"/>
    <rect class="accent" x="24" y="550" width="5" height="72" rx="2"/>
    <text class="name" x="44" y="591">Repository</text>
    <rect class="chip" x="196" y="566" width="250" height="40" rx="7"/>
    <text class="chip-title" x="321" y="583" text-anchor="middle">FormSchema-driven</text>
    <text class="sub" x="321" y="598" text-anchor="middle">CRUD SQL generated</text>
    <rect class="chip" x="454" y="566" width="250" height="40" rx="7"/>
    <text class="chip-title" x="579" y="583" text-anchor="middle">AnyCode</text>
    <text class="sub" x="579" y="598" text-anchor="middle">reports and batch, implemented by the BO</text>
    <line class="link" x1="720" y1="586" x2="740" y2="586"/>
    <rect class="tag" x="740" y="566" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="582">CLEAN ARCHITECTURE</text>
    <text class="tag-role" x="756" y="598">Interface Adapter</text>
  </g>

  <!-- Polhem.Db -->
  <g class="ntier">
    <rect class="band" x="24" y="636" width="696" height="72" rx="10"/>
    <rect class="accent" x="24" y="636" width="5" height="72" rx="2"/>
    <text class="name" x="44" y="671">Polhem.Db</text>
    <text class="sub" x="44" y="687">data access</text>
    <rect class="chip" x="196" y="652" width="150" height="40" rx="7"/>
    <text class="chip-title" x="271" y="669" text-anchor="middle">IDialectFactory</text>
    <text class="sub" x="271" y="684" text-anchor="middle">routes per DatabaseType</text>
    <rect class="chip" x="354" y="652" width="196" height="40" rx="7"/>
    <text class="chip-title" x="452" y="669" text-anchor="middle">DbDialectRegistry</text>
    <text class="sub" x="452" y="684" text-anchor="middle">SQL Server · PostgreSQL · …</text>
    <rect class="chip" x="558" y="652" width="146" height="40" rx="7"/>
    <text class="chip-title" x="631" y="669" text-anchor="middle">DbProviderRegistry</text>
    <text class="sub" x="631" y="684" text-anchor="middle">DbProviderFactory</text>
    <line class="link" x1="720" y1="672" x2="740" y2="672"/>
    <rect class="tag" x="740" y="652" width="196" height="40" rx="8"/>
    <text class="tag-family" x="756" y="668">N-TIER</text>
    <text class="tag-role" x="756" y="684">Data Layer</text>
  </g>

  <!-- Database -->
  <g class="store">
    <rect class="band" x="24" y="722" width="696" height="60" rx="10"/>
    <rect class="accent" x="24" y="722" width="5" height="60" rx="2"/>
    <text class="name" x="44" y="757">Database</text>
    <path class="cyl" d="M196,738 a14,5 0 0 0 28,0 a14,5 0 0 0 -28,0 v20 a14,5 0 0 0 28,0 v-20"/>
    <text class="chip-text" x="238" y="757">SQL Server · PostgreSQL · SQLite · MySQL · …</text>
  </g>
    </g>
  </g>
</svg>
