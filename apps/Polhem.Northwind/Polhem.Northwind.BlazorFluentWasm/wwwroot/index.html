    <!-- IMPORTANT: the demo site serves this bundle under this path (NorthwindDemoSite.FluentWasmPath). Change both together.
         The base is written rather than declared: the browser's preload scanner would fetch every address below
         against a declared one before a script could change it. -->
    <script>
        var demoSite = location.pathname === "/fluent-wasm" || location.pathname.startsWith("/fluent-wasm/");
        document.write('<base href="' + (demoSite ? "/fluent-wasm/" : "/") + '" />');
    </script>
