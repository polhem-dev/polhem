name: Docs Check

# Deliberately separate from build-ci.yml, and deliberately without a paths filter:
# - build-ci.yml has a paths filter, so a push that only changes documents does not trigger it, and that is
#   exactly when links most need checking.
# - A link breaks when the file it points to is renamed or deleted, and that file is not always .md
#   (READMEs link to source files under src/).
# The check scripts use only bash, git and awk, need no .NET, and finish in seconds.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Check markdown relative links
      run: ./check-md-links.sh

    # Fails when a source document changed and its translation was not restamped, a translation is missing, or a
    # language switch line is wrong. The list of languages and their policies is in the script header.
    - name: Check translation sync
      run: ./check-docs-i18n.sh

    # Fails when a committed file names a plan file or points into local/, or a public document points to a file
    # under .claude/. Its fourth check is advisory and does not affect the exit code.
    - name: Check public document references
      run: ./check-public-docs.sh
