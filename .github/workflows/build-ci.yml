name: Build CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - '*.props'
      - '.github/workflows/build-ci.yml'
      - '.github/scripts/detect-docs-only.sh'
      - 'SonarQube.Analysis.xml'
  # No paths filter on pull requests: `build` is a required check of the branch protection on `main`, and a
  # required check that never starts leaves a documentation-only pull request waiting forever. A pull request that
  # changes only `.md` files is recognized inside the job instead (the "Detect documentation-only pull request"
  # step), so the job still starts and reports success without building. The documents themselves are checked by
  # `docs-check.yml`.
  pull_request:
    branches:
      - main
  # The merge queue builds `main` with the pull requests queued ahead and this one, and merges only when the required
  # checks pass on that commit. Every required check therefore has to report on this event too.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      db_scope:
        description: 'Database test scope (all = every database + SonarCloud; lite = SQL Server + SQLite)'
        type: choice
        options:
          - all
          - lite
        default: all

jobs:
  build:
    runs-on: ubuntu-latest

    # Only SQL Server is a permanent service container, because both lite and full mode need it.
    # PostgreSQL / MySQL / Oracle are started with `docker run` by the "Start extra database containers" step,
    # because the `services:` block of GitHub Actions does not support `if:` and cannot depend on the mode.
    # The runner runs on the host (not a container job), so after `-p` mapping `localhost:{port}` is reachable,
    # the same as with services.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: PolhemTest_Password123!
        ports:
          - 1433:1433

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0

    # Decides whether this job builds at all; the rules and their reasons are in the header of
    # `.github/scripts/detect-docs-only.sh`, which the `templates` and `browser` jobs run too. Every later step is
    # gated on `build == 'true'`, either directly or through "Resolve database scope", whose outputs stay empty when it
    # is skipped.
    # The `sqlserver` service above still starts on a documentation-only pull request, because `services:` has no
    # `if:`. That costs the image pull and start, well under the cost of the build and tests.
    - name: Detect documentation-only pull request
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: .github/scripts/detect-docs-only.sh

    # Decides which database tests run, lite (the default) or full; the rules are in the header of
    # `.github/scripts/resolve-db-scope.sh`, which the `browser` job runs too.
    - name: Resolve database scope
      id: scope
      if: steps.changes.outputs.build == 'true'
      env:
        DISPATCH_SCOPE: ${{ github.event.inputs.db_scope }}
        EVENT_NAME: ${{ github.event_name }}
        # head_commit exists on push events, and the merge queue's own commit on merge_group events; its message
        # starts with the pull request's title. Pull request events look at the title itself; otherwise [all-db]
        # would not work on a PR.
        COMMIT_MSG: ${{ github.event.head_commit.message || github.event.merge_group.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: .github/scripts/resolve-db-scope.sh

    # Start as early as possible: the containers get ready in the background during the setup and strict build
    # steps, so "Wait for extra database containers" does not wait from zero (an Oracle cold start takes 45-90 seconds).
    - name: Start extra database containers
      if: steps.scope.outputs.full == 'true'
      run: |
        docker pull postgres:17 &
        docker pull mysql:8.0 &
        docker pull gvenzl/oracle-free@sha256:c9803db54238b5be268c7f5916e3c5811ef106e58aeb2f1f9b690c135ed50672 &
        wait
        docker run -d --name polhem-pg -p 5432:5432 \
          -e POSTGRES_USER=testuser -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=common \
          postgres:17
        docker run -d --name polhem-mysql -p 3306:3306 \
          -e MYSQL_ROOT_PASSWORD=PolhemTest_Password123! -e MYSQL_DATABASE=common \
          -e MYSQL_USER=testuser -e MYSQL_PASSWORD=testpass \
          mysql:8.0
        docker run -d --name polhem-oracle -p 1521:1521 \
          -e ORACLE_PASSWORD=PolhemTest_Password123! -e APP_USER=testuser \
          -e APP_USER_PASSWORD=testpass \
          gvenzl/oracle-free@sha256:c9803db54238b5be268c7f5916e3c5811ef106e58aeb2f1f9b690c135ed50672

    - name: Setup .NET
      if: steps.changes.outputs.build == 'true'
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Setup Java (for SonarScanner)
      if: steps.scope.outputs.sonar == 'true'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
      with:
        distribution: zulu
        java-version: '17'

    - name: Cache SonarCloud packages
      if: steps.scope.outputs.sonar == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarScanner for .NET
      if: steps.scope.outputs.sonar == 'true'
      run: dotnet tool install --global dotnet-sonarscanner

    # sqlcmd runs inside the SQL Server service container, which ships it. Installing it on the runner took apt and
    # Ubuntu's package mirrors, and a mirror the runner could not resolve failed every build (2026-11-11).
    - name: Wait for SQL Server
      if: steps.changes.outputs.build == 'true'
      env:
        SA_PASSWORD: PolhemTest_Password123!
        SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
      run: |
        for i in {1..60}; do
          if docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server ready after ${i} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "SQL Server did not become ready in time" >&2
        exit 1

    - name: Create SQL Server test databases (common + company + log)
      if: steps.changes.outputs.build == 'true'
      env:
        SA_PASSWORD: PolhemTest_Password123!
        SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
      run: |
        docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q \
          "IF DB_ID('common') IS NULL CREATE DATABASE common; IF DB_ID('company') IS NULL CREATE DATABASE company; IF DB_ID('log') IS NULL CREATE DATABASE log;"

    # Strict build (analyzer gate): without the SonarScanner wrapper, TreatWarningsAsErrors and the analyzer rules
    # in .editorconfig really fail the build. The Sonar-wrapped build weakens that protection, so this separate
    # build is the gate.
    - name: Strict build (analyzer gate)
      if: steps.changes.outputs.build == 'true'
      run: dotnet build Polhem.slnx --configuration Release

    # Placed after the strict build: the containers have been starting in the background for about a minute since
    # "Start extra database containers", so they are usually ready and the wait costs almost nothing.
    - name: Wait for extra database containers
      if: steps.scope.outputs.full == 'true'
      env:
        MYSQL_ROOT_PASSWORD: PolhemTest_Password123!
      run: |
        # Uses each image's built-in health check command (the same as the --health-cmd of services).
        wait_for() {
          local name="$1"; shift
          for _ in $(seq 1 90); do
            if docker exec "$name" "$@" > /dev/null 2>&1; then
              echo "$name ready"
              return 0
            fi
            sleep 2
          done
          echo "$name did not become ready in time" >&2
          docker logs --tail 50 "$name" >&2 || true
          exit 1
        }
        wait_for polhem-pg     pg_isready -U testuser
        wait_for polhem-mysql  mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"
        wait_for polhem-oracle healthcheck.sh

    # These three connection strings exist only in full mode. In lite mode [DbFact] skips because the env var is
    # not set (tests/Polhem.Tests.Shared/DbFactAttribute.cs), and SharedDatabaseState skips registration and schema
    # creation for them, so no test code has to change.
    - name: Enable extra database connection strings
      if: steps.scope.outputs.full == 'true'
      run: |
        {
          echo 'POLHEM_TEST_CONNSTR_POSTGRESQL=Host=localhost;Port=5432;Database={@DbName};Username=testuser;Password=testpass'
          echo 'POLHEM_TEST_CONNSTR_MYSQL=Server=localhost;Port=3306;Database={@DbName};User=testuser;Password=testpass;'
          echo 'POLHEM_TEST_CONNSTR_ORACLE=Data Source=localhost:1521/FREEPDB1;User Id=testuser;Password=testpass;'
        } >> "$GITHUB_ENV"

    - name: Create PostgreSQL / MySQL test databases (company + log)
      if: steps.scope.outputs.full == 'true'
      env:
        MYSQL_ROOT_PASSWORD: PolhemTest_Password123!
        PGPASSWORD: testpass
      run: |
        # PostgreSQL: the container already created common; create company and log (testuser is a superuser).
        psql -h 127.0.0.1 -U testuser -d postgres -c \
          "SELECT 1 FROM pg_database WHERE datname='company'" | grep -q '1 row' || \
          psql -h 127.0.0.1 -U testuser -d postgres -c 'CREATE DATABASE company OWNER testuser'
        psql -h 127.0.0.1 -U testuser -d postgres -c \
          "SELECT 1 FROM pg_database WHERE datname='log'" | grep -q '1 row' || \
          psql -h 127.0.0.1 -U testuser -d postgres -c 'CREATE DATABASE log OWNER testuser'
        # MySQL: the container already created common; create company and log and grant them to testuser (needs root).
        # The `polhem_%` grant lets the database initialization tests create and drop databases of their own.
        mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e \
          "CREATE DATABASE IF NOT EXISTS company; \
           CREATE DATABASE IF NOT EXISTS log; \
           GRANT ALL PRIVILEGES ON company.* TO 'testuser'@'%'; \
           GRANT ALL PRIVILEGES ON log.* TO 'testuser'@'%'; \
           GRANT ALL PRIVILEGES ON \`polhem_%\`.* TO 'testuser'@'%'; \
           FLUSH PRIVILEGES;"

    - name: SonarScanner Begin
      if: steps.scope.outputs.sonar == 'true'
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"polhem-dev_polhem" \
          /o:"polhem-dev" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /s:"$GITHUB_WORKSPACE/SonarQube.Analysis.xml"

    # Runs only in full mode. Skipping it in lite mode does not affect the later --no-build steps: "Strict build
    # (analyzer gate)" already built the same Release configuration, so the outputs exist. The --no-incremental
    # here lets SonarScanner observe a complete compilation; the outputs do not need it.
    - name: Build (for Sonar coverage)
      if: steps.scope.outputs.sonar == 'true'
      run: dotnet build Polhem.slnx --configuration Release --no-incremental

    # The PostgreSQL / MySQL / Oracle connection strings come from "Enable extra database connection strings"
    # through $GITHUB_ENV and exist only in full mode; only the two that both modes need are listed here.
    # Coverage is collected only when SonarScanner runs (full mode, outside the merge queue): otherwise nobody would
    # collect it, and a report without three providers would only push the SonarCloud numbers down.
    # The template tests run in the `templates` job instead; the filter leaves out only that project, so a new test
    # project is picked up here without any list to update. In lite mode the browser tests run in the `browser` job
    # and are left out here by namespace too; in full mode they stay here, so their coverage reaches SonarCloud.
    - name: Test with coverage
      if: steps.changes.outputs.build == 'true'
      env:
        # SharedDatabaseState replaces {@DbName} with common / company for each DatabaseItem, matching the two
        # physical databases created in the previous step. Oracle is the exception (it is not separated by DbName).
        POLHEM_TEST_CONNSTR_SQLSERVER: "Server=localhost,1433;Database={@DbName};User Id=sa;Password=PolhemTest_Password123!;Encrypt=True;TrustServerCertificate=True;"
        # SQLite is a pure driver with no service container — in-memory shared cache so
        # multiple connections see the same database (cache=shared) and there is no IO
        # to clean up between runs. Each {@DbName} substitution maps to an independent
        # in-memory DB (polhem_test_common / polhem_test_company / …).
        POLHEM_TEST_CONNSTR_SQLITE: "Data Source=file:polhem_test_{@DbName}?mode=memory&cache=shared"
      run: >-
        dotnet test Polhem.slnx --configuration Release --no-build --verbosity normal
        --filter "FullyQualifiedName!~Polhem.Templates.UnitTests.${{ steps.scope.outputs.full != 'true' && '&FullyQualifiedName!~.BrowserTests.' || '' }}"
        ${{ steps.scope.outputs.sonar == 'true' && '--collect:"XPlat Code Coverage;Format=opencover"' || '' }}

    - name: SonarScanner End
      if: steps.scope.outputs.sonar == 'true'
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: Pack NuGet packages (verification only, not pushed)
      if: steps.changes.outputs.build == 'true'
      run: |
        dotnet pack src/Polhem.Core/Polhem.Core.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Expressions/Polhem.Expressions.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Definition/Polhem.Definition.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.ObjectCaching/Polhem.ObjectCaching.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Db/Polhem.Db.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Business/Polhem.Business.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Api.Client/Polhem.Api.Client.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Api.Contracts/Polhem.Api.Contracts.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Api.Core/Polhem.Api.Core.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Hosting/Polhem.Hosting.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Repository.Abstractions/Polhem.Repository.Abstractions.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Repository/Polhem.Repository.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.UI.Core/Polhem.UI.Core.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.UI.ApiBridge/Polhem.UI.ApiBridge.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.UI.Avalonia/Polhem.UI.Avalonia.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.UI.Avalonia.Shell/Polhem.UI.Avalonia.Shell.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Web.Blazor/Polhem.Web.Blazor.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Web.Blazor.Mud/Polhem.Web.Blazor.Mud.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Web.Blazor.Fluent/Polhem.Web.Blazor.Fluent.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Web.Blazor.Server/Polhem.Web.Blazor.Server.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Polhem.Web.Blazor.Wasm/Polhem.Web.Blazor.Wasm.csproj --configuration Release --output ./nupkgs --no-build
        # tools/Polhem.Cli is published too, but it is not in Polhem.slnx: the solution build reaches it only
        # through the ProjectReference of tests/Polhem.Cli.UnitTests, and a project outside the solution is built
        # in its default Debug configuration. So this pack builds it in Release itself, and has no --no-build.
        dotnet pack tools/Polhem.Cli/Polhem.Cli.csproj --configuration Release --output ./nupkgs
        # tools/DefineEditor and tools/DbManager are published as dotnet tools as well, and reach the solution build
        # the same way (through their tests/*.UnitTests), so they are packed here on the same terms.
        dotnet pack tools/DefineEditor/Polhem.DefineEditor.csproj --configuration Release --output ./nupkgs
        dotnet pack tools/DbManager/Polhem.DbManager.csproj --configuration Release --output ./nupkgs
        dotnet pack tools/Polhem.Templates/Polhem.Templates.csproj --configuration Release --output ./nupkgs

    # The pack above rewrites each template's localize/templatestrings.*.json from its template.json
    # (Microsoft.TemplateEngine.Authoring.Tasks). A change here means a template string was added or removed without
    # the translation files being committed, and the package would ship the English for it.
    - name: Check template translation files are committed
      if: steps.changes.outputs.build == 'true'
      run: |
        changes=$(git status --porcelain -- tools/Polhem.Templates/content)
        if [ -n "$changes" ]; then
          printf '%s\n' "$changes"
          git diff -- tools/Polhem.Templates/content
          echo "::error::Build tools/Polhem.Templates locally, translate the new strings, record their English in tests/Polhem.Templates.UnitTests/TranslationSources, and commit both."
          exit 1
        fi

    # Mobile AOT gate: `DynamicCodeSupport=false` is exactly what the .NET for iOS SDK sets for every
    # iOS / tvOS / MacCatalyst build, mapped to the RuntimeHostConfigurationOption of
    # `RuntimeFeature.IsDynamicCodeSupported`.
    # Without this gate, "a wire type whose formatter was never registered" goes unnoticed on desktop (the
    # contractless resolver takes over) and only shows up on mobile as FormatterNotRegisteredException.
    # It needs a rebuild (a different runtimeconfig), so it has no --no-build and is the last step of the job,
    # so that it does not disturb the outputs used by the earlier --no-build steps.
    # It covers both halves: the MessagePack wire (Polhem.Api.Core) and the reflection-only XmlSerializer path
    # (Polhem.Definition / Polhem.Core). The latter was not gated before, and it is the kind that has actually
    # broken: the get-only setter defect of LanguageEnum.Entries (https://github.com/jeff377/bee-library/commit/5e748b08)
    # was found by a manual scan, not by CI.
    # The other projects in the list test the rest of what a mobile head ships: the expression interpreter
    # (Polhem.Expressions), the API client (Polhem.Api.Client), the bridge between them (Polhem.UI.ApiBridge) and
    # the UI layers (Polhem.UI.Core, Polhem.UI.Avalonia, Polhem.UI.Avalonia.Shell). Test projects of server-only packages stay out, with one
    # exception: the dispatch round trips in Polhem.Api.Server.UnitTests encode and decode every message the way a
    # mobile client does, and they ran in this gate as part of Polhem.Api.Core.UnitTests until ADR-055 moved them.
    #
    # Known blind spot: this gate runs on CoreCLR, where MakeGenericType / MakeGenericMethod are not affected by
    # the switch. MakeGenericType is exactly why ADR-037 requires closed generic instantiations to be registered,
    # so that kind of failure is covered by the static closure in WireContractDriftTests. Each gate covers one
    # half, and both are needed.
    - name: Mobile AOT gate (wire + XmlSerializer reflection-only path)
      if: steps.changes.outputs.build == 'true'
      env:
        # As in the Test step, the other three come from $GITHUB_ENV and exist only in full mode.
        POLHEM_TEST_CONNSTR_SQLSERVER: "Server=localhost,1433;Database={@DbName};User Id=sa;Password=PolhemTest_Password123!;Encrypt=True;TrustServerCertificate=True;"
        POLHEM_TEST_CONNSTR_SQLITE: "Data Source=file:polhem_test_{@DbName}?mode=memory&cache=shared"
      run: |
        for proj in \
          tests/Polhem.Api.Core.UnitTests/Polhem.Api.Core.UnitTests.csproj \
          tests/Polhem.Api.Server.UnitTests/Polhem.Api.Server.UnitTests.csproj \
          tests/Polhem.Definition.UnitTests/Polhem.Definition.UnitTests.csproj \
          tests/Polhem.Core.UnitTests/Polhem.Core.UnitTests.csproj \
          tests/Polhem.Expressions.UnitTests/Polhem.Expressions.UnitTests.csproj \
          tests/Polhem.Api.Client.UnitTests/Polhem.Api.Client.UnitTests.csproj \
          tests/Polhem.UI.Core.UnitTests/Polhem.UI.Core.UnitTests.csproj \
          tests/Polhem.UI.ApiBridge.UnitTests/Polhem.UI.ApiBridge.UnitTests.csproj \
          tests/Polhem.UI.Avalonia.UnitTests/Polhem.UI.Avalonia.UnitTests.csproj \
          tests/Polhem.UI.Avalonia.Shell.UnitTests/Polhem.UI.Avalonia.Shell.UnitTests.csproj
        do
          dotnet test "$proj" --configuration Release --verbosity normal -p:DynamicCodeSupport=false
        done

  # The template tests generate, build, publish and start whole applications. They share one packed feed, so they run
  # one after another and take several minutes, which made them the slowest part of the `build` job's test step.
  # Here they run beside `build`. `build` leaves them out with a filter on this project's namespace.
  # This job is a required check of the branch protection on `main`, like `build`, so it also always starts on a pull
  # request and skips its work when only `.md` files changed.
  templates:
    runs-on: ubuntu-latest
    # Each `dotnet` command of the template tests may take up to 10 minutes before the fixture gives up; this caps a
    # hung run well below GitHub's default of 360 minutes.
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        # The detection below compares HEAD with its first parent.
        fetch-depth: 2

    - name: Detect documentation-only pull request
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: .github/scripts/detect-docs-only.sh

    - name: Setup .NET
      if: steps.changes.outputs.build == 'true'
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Template tests
      if: steps.changes.outputs.build == 'true'
      run: dotnet test tests/Polhem.Templates.UnitTests/Polhem.Templates.UnitTests.csproj --configuration Release --verbosity normal

  # The browser tests start a Blazor Server site of each UI package's test pages and drive the installed Chrome through
  # Playwright. Each test class runs its tests one after another, and they were the slowest part of the `build` job's
  # test step once the template tests had left it. In lite mode they run here, beside `build`. In full mode `build`
  # runs them, because SonarCloud's coverage is collected there, and this job skips them; both jobs read the mode from
  # `.github/scripts/resolve-db-scope.sh`.
  # This job is a required check of the branch protection on `main`, like `build`, so it also always starts on a pull
  # request and skips its work when only `.md` files changed.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        # The detection below compares HEAD with its first parent.
        fetch-depth: 2

    - name: Detect documentation-only pull request
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: .github/scripts/detect-docs-only.sh

    - name: Resolve database scope
      id: scope
      if: steps.changes.outputs.build == 'true'
      env:
        DISPATCH_SCOPE: ${{ github.event.inputs.db_scope }}
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MSG: ${{ github.event.head_commit.message || github.event.merge_group.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: .github/scripts/resolve-db-scope.sh

    - name: Setup .NET
      if: steps.scope.outputs.full == 'false'
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: 10.0.x

    # The filter keeps only the browser test namespaces, so a new browser test project is picked up without any list
    # to update. The other test projects still start and find nothing to run, which takes under a second each.
    - name: Browser tests
      if: steps.scope.outputs.full == 'false'
      run: >-
        dotnet test Polhem.slnx --configuration Release --verbosity normal
        --filter "FullyQualifiedName~.BrowserTests."
